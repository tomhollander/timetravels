    <div class="tabs">
        <div class="tab" id="keytab" onclick="window.location='sydney_key.html'">Key Map</div>
        <div class="tab" id="year-1935" onclick="setYear('1935');">1935</div>

        </div>

        <script>
            if (getQueryStringParameter('page')) {
                currentPage = getQueryStringParameter('page');
            } else {
                currentPage = "1-2";
            }
            if (getQueryStringParameter('year')) {
                currentYear = getQueryStringParameter('year');
            } else {
                currentYear = "1935";
            }

            document.addEventListener('DOMContentLoaded', async () => {
                // Call the function to load data
                data = await loadData("sydney");
                showInitialMap();
            });
            
        </script>
